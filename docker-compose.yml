services:
  cafeqr:
    image: cafeqr:latest
    container_name: cafeqr-app
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: cafeqr-caddy
    restart: unless-stopped
    depends_on:
      - cafeqr
    ports:
      - "80:80"
      - "443:443"
    command:
      - caddy
      - reverse-proxy
      - --from
      - cafeqr.egokam.site
      - --to
      - cafeqr:3000
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
